<!--
  Centralized config for the "windows" agent group.
  Installed by setup-manager.sh to /var/ossec/etc/shared/windows/agent.conf.
  Every agent in the group downloads this automatically (within a few minutes)
  and merges it with its own local ossec.conf.

  The Windows agent ALREADY collects the Security, System and Application
  event logs by default, so they are not repeated here (repeating them would
  create duplicates). Security covers the events this lab needs:
  4624/4625 logons, 4740 lockouts, 4720/4722/4724/4725/4726/4738 account
  changes, 4732/4733 group changes, 4719 audit-policy changes, 4688 process
  creation (once Enable-AuditPolicy.ps1 has turned that auditing on).

  Note: the default Security query skips firewall drop events 5152 and 5157
  because they are extremely noisy. That's why this lab watches blocked
  connections on the Linux server (UFW) instead.
-->
<agent_config os="Windows">

  <!-- PowerShell script-block logging (turned on by Enable-AuditPolicy.ps1).
       Shows the actual commands that ran during the simulations. -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon (unit 4, installed by lab/windows/Install-Sysmon.ps1): what ran,
       what it connected to, what it set to start automatically. Before Sysmon
       is installed the agent logs a warning that this channel doesn't exist;
       that's harmless. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Microsoft Defender detections and settings changes. -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Firewall rule and profile changes (not individual drops). -->
  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Refresh the software inventory every hour so the vulnerability
       scan picks up installs, updates and removals quickly. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

</agent_config>
