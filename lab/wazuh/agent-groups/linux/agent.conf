<!--
  Centralized config for the "linux" agent group.
  Installed by setup-manager.sh to /var/ossec/etc/shared/linux/agent.conf.
  Every agent in the group downloads this automatically (within a few minutes)
  and merges it with its own local ossec.conf.

  Log collection: on Ubuntu 24.04 the Wazuh agent already reads journald,
  which carries sshd, sudo, useradd/gpasswd/passwd and kernel (UFW) messages.
  So nothing is added for logs here; adding /var/log/auth.log as well would
  just give you every event twice.
-->
<agent_config os="Linux">

  <!-- File integrity monitoring (FIM): alert within seconds when the files
       that define users, groups, sudo rights and SSH settings change.
       The default FIM scan only runs every 12 hours. -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="no">/etc/passwd,/etc/group,/etc/shadow,/etc/gshadow</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d,/etc/ssh/sshd_config,/etc/ssh/sshd_config.d</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ufw</directories>
  </syscheck>

  <!-- Suricata network alerts (unit 4, lab/linux/setup-suricata.sh). Before
       Suricata is installed the agent warns the file is missing; harmless. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Refresh the software inventory every hour so the vulnerability
       scan picks up installs, upgrades and removals quickly. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

</agent_config>
