# nginx for acme-web: static company site at /, portal proxied at /portal/.
# Access and error logs go to /var/log/nginx (a mounted volume), so the Wazuh
# agent on web-srv ships them and you get web-layer visibility.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Company website (static).
    location / {
        try_files $uri $uri/ =404;
    }

    # Employee portal (Flask app). Pass the real client IP so the portal's
    # auth log records who connected. X-Forwarded-For is SET to the connecting
    # address, not appended to: appending would keep whatever a client sent in
    # its own X-Forwarded-For header, and the portal logs the first address in
    # it, so anyone could pick the source address their logins are logged under
    # (and slip past rules that count failures per source).
    location /portal/ {
        proxy_pass http://acme-portal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
