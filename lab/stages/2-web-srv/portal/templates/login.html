<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Corp - Employee Portal</title>
  <style>
    body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:#eef3fb; color:#1b2330; }
    .card { max-width:360px; margin:8vh auto; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:32px; box-shadow:0 10px 30px rgba(27,35,48,.06); }
    .logo { font-weight:800; font-size:22px; text-align:center; margin-bottom:4px; }
    .logo .dot { color:#2b6cb0; }
    .sub { text-align:center; color:#5a6474; font-size:14px; margin-bottom:22px; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:15px; }
    button { width:100%; margin-top:20px; background:#2b6cb0; color:#fff; border:0; padding:11px; border-radius:7px; font-size:15px; font-weight:600; cursor:pointer; }
    .error { background:#fde8e8; color:#9b2c2c; border:1px solid #f5b5b5; padding:9px 12px; border-radius:7px; font-size:13px; margin-bottom:8px; }
    .note { margin-top:18px; font-size:12px; color:#8a94a6; text-align:center; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/portal/login">
    <div class="logo">ACME<span class="dot">.</span>Corp</div>
    <div class="sub">Employee Portal</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div class="note">Lab environment. Demo login: demo.user / AcmeDemo1!</div>
  </form>
</body>
</html>
