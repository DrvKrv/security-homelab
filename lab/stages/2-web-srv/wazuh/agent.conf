<!--
  Centralized config for a new "web" agent group, for web-srv.
  Install it on the Wazuh MANAGER (the wazuh VM) alongside the existing groups:
    sudo install -m 660 -o wazuh -g wazuh agent.conf \
      /var/ossec/etc/shared/web/agent.conf
  then create the group and assign web-srv's agent to it (see wazuh/README.md).

  Ubuntu 24.04's agent already reads journald (sshd, sudo, kernel/UFW, etc.),
  so only the app-specific logs are added here.
-->
<agent_config os="Linux">

  <!-- Portal authentication events: the file the Flask app writes. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/acme-portal/auth.log</location>
  </localfile>

  <!-- nginx access + error logs for the company site and portal proxy. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/acme-web/access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/acme-web/error.log</location>
  </localfile>

  <!-- File integrity monitoring on the web content and the stack definition,
       so a change to the site or compose file raises an alert. -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/opt/security-homelab/lab/stages/2-web-srv/site</directories>
  </syscheck>

  <!-- Hourly software inventory feeds the vulnerability scan. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

</agent_config>
